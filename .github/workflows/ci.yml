name: Privacy & Quality CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: npm ci

      - name: Run privacy gate on tracked files
        run: python3 scripts/release_snapshot_policy.py scan-git --tracked

      - name: Run contract tests
        run: node --test scripts/quality-contracts.test.js
